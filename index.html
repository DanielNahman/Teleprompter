<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Teleprompter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #EEF1F4;
    --surface: #FFFFFF;
    --ink: #14181D;
    --muted: #5B6672;
    --line: #D3D9E0;
    --tally: #E5332A;
    --on-ink: #FFFFFF;
    --font: "Heebo", -apple-system, "Arial Hebrew", "Segoe UI", Arial, sans-serif;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #15181C;
      --surface: #1F242A;
      --ink: #F1F3F5;
      --muted: #9AA5B1;
      --line: #343B44;
      --on-ink: #15181C;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #15181C;
    --surface: #1F242A;
    --ink: #F1F3F5;
    --muted: #9AA5B1;
    --line: #343B44;
    --on-ink: #15181C;
  }

  *, *::before, *::after { box-sizing: border-box; }
  html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    height: 100%;
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font);
    font-size: 17px;
    line-height: 1.45;
    -webkit-text-size-adjust: 100%;
  }
  [hidden] { display: none !important; }
  button { font: inherit; color: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  button:focus-visible, textarea:focus-visible { outline: 3px solid #4C9BFF; outline-offset: 2px; }

  /* ---------- Script and result screens ---------- */
  .screen {
    height: 100%;
    max-width: 640px;
    margin: 0 auto;
    padding: 20px 18px 18px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  h1 { font-size: 26px; line-height: 1.2; font-weight: 700; margin: 0; }
  .sub { margin: 0; color: var(--muted); font-size: 15px; }

  textarea {
    flex: 1;
    min-height: 0;
    width: 100%;
    resize: none;
    border: 1.5px solid var(--line);
    border-radius: 14px;
    background: var(--surface);
    color: var(--ink);
    font-family: var(--font);
    font-size: 20px;
    line-height: 1.6;
    padding: 16px;
  }
  textarea::placeholder { color: var(--muted); }

  .row { display: flex; align-items: center; gap: 10px; }
  .row .grow { flex: 1; }
  .count { color: var(--muted); font-size: 14px; }

  .btn {
    min-height: 52px;
    padding: 0 20px;
    border-radius: 14px;
    border: 1.5px solid var(--line);
    background: transparent;
    font-weight: 500;
  }
  .btn.primary {
    background: var(--ink);
    border-color: var(--ink);
    color: var(--on-ink);
    font-weight: 700;
  }
  .btn.primary:disabled { opacity: .35; cursor: default; }
  .btn.wide { width: 100%; }

  .playback {
    flex: 1;
    min-height: 0;
    width: 100%;
    background: #000;
    border-radius: 14px;
    object-fit: contain;
  }
  .status { min-height: 1.45em; margin: 0; font-size: 15px; color: var(--muted); }

  /* ---------- Recording stage (always dark) ---------- */
  .stage {
    position: fixed;
    inset: 0;
    z-index: 5;
    background: #000;
    color: #fff;
    display: flex;
    flex-direction: column;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    overflow: hidden;
  }
  .stage video.cam {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    transform: scaleX(-1);
  }
  .stage .scrim {
    position: absolute;
    inset: 0;
    background: linear-gradient(to bottom, rgba(0,0,0,.66) 0%, rgba(0,0,0,.5) 55%, rgba(0,0,0,.62) 100%);
    pointer-events: none;
  }
  .stage > .bar, .stage > .scroller, .stage > .controls, .stage > .notice { position: relative; z-index: 1; }

  .bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 12px;
  }
  .icon-btn {
    width: 44px; height: 44px;
    border-radius: 50%;
    border: 0;
    background: rgba(255,255,255,.16);
    color: #fff;
    font-size: 20px;
    line-height: 1;
  }
  .timer {
    display: flex; align-items: center; gap: 8px;
    padding: 6px 12px;
    border-radius: 999px;
    background: rgba(0,0,0,.45);
    font-variant-numeric: tabular-nums;
    font-weight: 500;
  }
  .timer .dot { width: 10px; height: 10px; border-radius: 50%; background: rgba(255,255,255,.4); }
  .timer.live .dot { background: var(--tally); animation: blink 1.2s steps(2, start) infinite; }
  @keyframes blink { to { visibility: hidden; } }
  @media (prefers-reduced-motion: reduce) { .timer.live .dot { animation: none; } }

  .scroller {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    overscroll-behavior: contain;
    -webkit-overflow-scrolling: touch;
    padding: 6vh 22px 70vh;
    -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 7%, #000 62%, rgba(0,0,0,.25) 100%);
            mask-image: linear-gradient(to bottom, transparent 0, #000 7%, #000 62%, rgba(0,0,0,.25) 100%);
  }
  .scroller p {
    margin: 0 0 .7em;
    font-weight: 500;
    line-height: 1.45;
    text-align: start;
    text-shadow: 0 1px 3px rgba(0,0,0,.9), 0 0 14px rgba(0,0,0,.6);
    overflow-wrap: anywhere;
  }

  .notice {
    margin: 0 16px 10px;
    padding: 12px 14px;
    border-radius: 12px;
    background: rgba(20,24,29,.92);
    border: 1px solid rgba(255,255,255,.18);
    font-size: 15px;
  }
  .chip {
    position: absolute;
    z-index: 2;
    left: 50%;
    bottom: 150px;
    transform: translateX(-50%);
    padding: 6px 14px;
    border-radius: 999px;
    background: rgba(0,0,0,.7);
    font-size: 14px;
    white-space: nowrap;
  }
  .countdown {
    position: absolute;
    inset: 0;
    z-index: 3;
    display: grid;
    place-items: center;
    background: rgba(0,0,0,.45);
    font-size: 40vw;
    font-weight: 700;
    line-height: 1;
  }

  .controls {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: end;
    gap: 8px;
    padding: 10px 14px 14px;
  }
  .stepper { display: flex; flex-direction: column; gap: 6px; align-items: center; }
  .stepper .label { font-size: 13px; color: rgba(255,255,255,.8); }
  .stepper .pair { display: flex; align-items: center; gap: 6px; }
  .stepper .val { min-width: 1.6em; text-align: center; font-variant-numeric: tabular-nums; font-weight: 500; }
  .stepper .icon-btn { font-size: 18px; font-weight: 700; }

  .rec-wrap { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .rec-wrap .label { font-size: 13px; color: rgba(255,255,255,.8); }
  .rec {
    width: 76px; height: 76px;
    border-radius: 50%;
    border: 4px solid #fff;
    background: transparent;
    display: grid;
    place-items: center;
    padding: 0;
  }
  .rec::after {
    content: "";
    width: 58px; height: 58px;
    border-radius: 50%;
    background: var(--tally);
    transition: width .15s, height .15s, border-radius .15s;
  }
  .rec.on::after { width: 30px; height: 30px; border-radius: 7px; }
  .rec:disabled { opacity: .35; cursor: default; }
  @media (prefers-reduced-motion: reduce) { .rec::after { transition: none; } }
</style>
</head>
<body>

<!-- 1. Script -->
<main class="screen" id="setup">
  <div>
    <h1>Teleprompter</h1>
    <p class="sub">Paste your script, then open the camera to record yourself reading it.</p>
  </div>
  <textarea id="script" dir="auto" placeholder="Paste your text here" aria-label="Script text" autocomplete="off" autocapitalize="off" spellcheck="false"></textarea>
  <div class="row">
    <span class="count grow" id="count"></span>
    <button class="btn" id="clear" type="button">Clear</button>
  </div>
  <button class="btn primary wide" id="open" type="button" disabled>Open camera</button>
</main>

<!-- 2. Recording stage -->
<section class="stage" id="stage" hidden aria-label="Teleprompter and camera">
  <video class="cam" id="cam" autoplay muted playsinline></video>
  <div class="scrim"></div>

  <div class="bar">
    <button class="icon-btn" id="close" type="button" aria-label="Back to script">✕</button>
    <div class="timer" id="timer"><span class="dot"></span><span id="clock">00:00</span></div>
  </div>

  <div class="scroller" id="scroller"></div>

  <div class="notice" id="notice" hidden role="alert"></div>
  <div class="chip" id="chip" hidden>Scrolling paused. Tap the text to continue</div>
  <div class="countdown" id="countdown" hidden aria-live="assertive"></div>

  <div class="controls">
    <div class="stepper">
      <div class="pair">
        <button class="icon-btn" id="sizeDown" type="button" aria-label="Smaller text">A−</button>
        <button class="icon-btn" id="sizeUp" type="button" aria-label="Larger text">A+</button>
      </div>
      <span class="label">Text size</span>
    </div>

    <div class="rec-wrap">
      <button class="rec" id="rec" type="button" aria-label="Record" disabled></button>
      <span class="label" id="recLabel">Record</span>
    </div>

    <div class="stepper">
      <div class="pair">
        <button class="icon-btn" id="speedDown" type="button" aria-label="Slower scrolling">−</button>
        <span class="val" id="speedVal">5</span>
        <button class="icon-btn" id="speedUp" type="button" aria-label="Faster scrolling">+</button>
      </div>
      <span class="label">Scroll speed</span>
    </div>
  </div>
</section>

<!-- 3. Result -->
<main class="screen" id="result" hidden>
  <div>
    <h1>Your recording</h1>
    <p class="sub" id="meta"></p>
  </div>
  <video class="playback" id="playback" controls playsinline></video>
  <p class="status" id="status" role="status"></p>
  <button class="btn primary wide" id="save" type="button">Save video</button>
  <div class="row">
    <button class="btn grow" id="again" type="button">Record again</button>
    <button class="btn grow" id="edit" type="button">Edit script</button>
  </div>
</main>

<script>
(function () {
  "use strict";
  var $ = function (id) { return document.getElementById(id); };

  var store = {
    get: function (k, d) { try { var v = localStorage.getItem(k); return v === null ? d : v; } catch (e) { return d; } },
    set: function (k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  };

  // Platform save capability (arrives later, may be null)
  var downloads = null;
  if (window.claude && typeof window.claude.use === "function") {
    window.claude.use("downloads").then(function (d) { downloads = d; }).catch(function () {});
  }
  var isTop = false;
  try { isTop = window.top === window; } catch (e) { isTop = false; }

  var setup = $("setup"), stage = $("stage"), result = $("result");
  var script = $("script"), count = $("count"), openBtn = $("open");
  var cam = $("cam"), scroller = $("scroller"), notice = $("notice"), chip = $("chip");
  var countdown = $("countdown"), timer = $("timer"), clock = $("clock");
  var rec = $("rec"), recLabel = $("recLabel"), speedVal = $("speedVal");
  var playback = $("playback"), statusEl = $("status"), meta = $("meta");
  var saveBtn = $("save"), againBtn = $("again");

  var fontSize = clamp(parseInt(store.get("tp.size", "32"), 10) || 32, 20, 68);
  var speed = clamp(parseInt(store.get("tp.speed", "5"), 10), 0, 10);
  if (isNaN(speed)) speed = 5;

  var state = "idle"; // idle | countdown | recording | saving
  var stream = null, recorder = null, chunks = [];
  var blob = null, blobUrl = null, filename = "", saved = false;
  var pos = 0, paused = false, touching = false, touchTimer = null, lastT = 0;
  var startedAt = 0, clockTimer = null, countTimer = null, wakeLock = null;

  function clamp(n, a, b) { return Math.max(a, Math.min(b, n)); }
  function show(el) { setup.hidden = el !== setup; stage.hidden = el !== stage; result.hidden = el !== result; }

  /* ---------- Script screen ---------- */
  script.value = store.get("tp.text", "");
  function updateCount() {
    var t = script.value.trim();
    var words = t ? t.split(/\s+/).length : 0;
    openBtn.disabled = words === 0;
    if (!words) { count.textContent = ""; return; }
    var secs = Math.round(words / 130 * 60);
    var est = secs < 60 ? "about " + Math.max(5, Math.round(secs / 5) * 5) + " sec" : "about " + (Math.round(secs / 30) / 2) + " min";
    count.textContent = words + (words === 1 ? " word, " : " words, ") + est + " to read";
  }
  script.addEventListener("input", function () { store.set("tp.text", script.value); updateCount(); });
  $("clear").addEventListener("click", function () { script.value = ""; store.set("tp.text", ""); updateCount(); script.focus(); });
  updateCount();

  openBtn.addEventListener("click", openStage);

  /* ---------- Stage ---------- */
  function renderText() {
    scroller.textContent = "";
    script.value.replace(/\r/g, "").split(/\n+/).forEach(function (line) {
      if (!line.trim()) return;
      var p = document.createElement("p");
      p.dir = "auto";
      p.textContent = line.trim();
      scroller.appendChild(p);
    });
    applySize();
  }
  function applySize() { scroller.style.fontSize = fontSize + "px"; }
  function applySpeed() { speedVal.textContent = String(speed); }

  function openStage() {
    renderText();
    applySpeed();
    notice.hidden = true;
    chip.hidden = true;
    rec.disabled = true;
    setIdleUi();
    show(stage);
    scroller.scrollTop = 0; pos = 0;
    startCamera();          // called straight from the tap so iOS shows the permission prompt
    requestWake();
  }

  function startCamera() {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      return camError("This view can’t reach the camera..");
    }
    if (typeof window.MediaRecorder === "undefined") {
      return camError("This browser can’t record video. Update iOS and try again.");
    }
    navigator.mediaDevices.getUserMedia({
      video: { facingMode: "user", width: { ideal: 1920 }, height: { ideal: 1080 }, frameRate: { ideal: 30 } },
      audio: { echoCancellation: true, noiseSuppression: true }
    }).then(function (s) {
      if (stage.hidden) { s.getTracks().forEach(function (t) { t.stop(); }); return; }
      stream = s;
      cam.srcObject = s;
      var p = cam.play(); if (p && p.catch) p.catch(function () {});
      rec.disabled = false;
    }).catch(function (err) {
      var name = err && err.name;
      if (name === "NotAllowedError" || name === "SecurityError") {
        camError("Camera and microphone are blocked in this view.", err);
      } else if (name === "NotFoundError" || name === "OverconstrainedError") {
        camError("No camera or microphone was found on this device.", err);
      } else if (name === "NotReadableError") {
        camError("The camera is in use by another app. Close it and reopen the camera here.", err);
      } else {
        camError("The camera didn’t start.", err);
      }
    });
  }
  function camError(msg, err) {
    var detail = err ? " [" + (err.name || "Error") + (err.message ? ": " + err.message : "") + "]" : "";
    notice.textContent = msg + detail; notice.hidden = false; rec.disabled = true;
  }

  function stopCamera() {
    if (stream) { stream.getTracks().forEach(function (t) { t.stop(); }); stream = null; }
    cam.srcObject = null;
  }

  function requestWake() {
    try {
      if (navigator.wakeLock && navigator.wakeLock.request) {
        navigator.wakeLock.request("screen").then(function (w) { wakeLock = w; }).catch(function () {});
      }
    } catch (e) {}
  }
  function releaseWake() { try { if (wakeLock) wakeLock.release(); } catch (e) {} wakeLock = null; }

  function setIdleUi() {
    state = "idle";
    rec.classList.remove("on");
    rec.setAttribute("aria-label", "Record");
    recLabel.textContent = "Record";
    timer.classList.remove("live");
    clock.textContent = "00:00";
    countdown.hidden = true;
    paused = false; chip.hidden = true;
  }

  rec.addEventListener("click", function () {
    if (state === "idle") beginCountdown();
    else if (state === "countdown") cancelCountdown();
    else if (state === "recording") stopRecording();
  });

  function beginCountdown() {
    if (!stream) return;
    state = "countdown";
    scroller.scrollTop = 0; pos = 0;
    recLabel.textContent = "Cancel";
    rec.setAttribute("aria-label", "Cancel");
    var n = 3;
    countdown.textContent = String(n);
    countdown.hidden = false;
    countTimer = setInterval(function () {
      n -= 1;
      if (n > 0) { countdown.textContent = String(n); return; }
      clearInterval(countTimer); countTimer = null;
      countdown.hidden = true;
      startRecording();
    }, 1000);
  }
  function cancelCountdown() {
    if (countTimer) { clearInterval(countTimer); countTimer = null; }
    setIdleUi();
  }

  function pickMime() {
    var list = ["video/mp4", "video/webm;codecs=vp9,opus", "video/webm;codecs=vp8,opus", "video/webm"];
    if (!MediaRecorder.isTypeSupported) return "";
    for (var i = 0; i < list.length; i++) { if (MediaRecorder.isTypeSupported(list[i])) return list[i]; }
    return "";
  }

  function startRecording() {
    if (!stream) { setIdleUi(); return; }
    var mime = pickMime();
    var opts = { videoBitsPerSecond: 5000000, audioBitsPerSecond: 128000 };
    if (mime) opts.mimeType = mime;
    chunks = [];
    try { recorder = new MediaRecorder(stream, opts); }
    catch (e) {
      try { recorder = new MediaRecorder(stream); }
      catch (e2) { setIdleUi(); camError("Recording didn’t start on this browser.", e2); return; }
    }
    recorder.ondataavailable = function (ev) { if (ev.data && ev.data.size) chunks.push(ev.data); };
    recorder.onstop = finish;
    recorder.onerror = function (ev) {
      notice.textContent = "The recorder stopped with an error. [" + ((ev && ev.error && ev.error.name) || "unknown") + "]";
      notice.hidden = false;
      if (state === "recording") stopRecording();
    };
    recorder.start();

    state = "recording";
    rec.classList.add("on");
    rec.setAttribute("aria-label", "Stop and save");
    recLabel.textContent = "Stop";
    timer.classList.add("live");
    startedAt = Date.now();
    clockTimer = setInterval(tickClock, 500);
    tickClock();
  }

  function tickClock() {
    var s = Math.floor((Date.now() - startedAt) / 1000);
    clock.textContent = pad(Math.floor(s / 60)) + ":" + pad(s % 60);
  }
  function pad(n) { return n < 10 ? "0" + n : String(n); }

  function stopRecording() {
    if (state !== "recording") return;
    state = "saving";
    if (clockTimer) { clearInterval(clockTimer); clockTimer = null; }
    rec.disabled = true;
    recLabel.textContent = "Saving";
    try { recorder.stop(); } catch (e) { finish(); }
  }

  function finish() {
    var type = ((recorder && recorder.mimeType) || (chunks[0] && chunks[0].type) || "video/mp4").split(";")[0];
    blob = new Blob(chunks, { type: type });
    chunks = [];
    recorder = null;
    stopCamera();
    releaseWake();

    var ext = type.indexOf("webm") !== -1 ? "webm" : "mp4";
    var d = new Date();
    filename = "teleprompter-" + d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()) + "-" + pad(d.getHours()) + pad(d.getMinutes()) + "." + ext;
    saved = false;

    if (blobUrl) URL.revokeObjectURL(blobUrl);
    blobUrl = URL.createObjectURL(blob);
    playback.src = blobUrl;
    meta.textContent = clock.textContent + " long, " + (blob.size / 1048576).toFixed(1) + " MB, " + ext.toUpperCase();
    againBtn.textContent = "Record again";
    statusEl.textContent = "";
    setIdleUi();
    show(result);

    if (!blob.size) { statusEl.textContent = "The recording came out empty. Record again."; saveBtn.disabled = true; return; }
    saveBtn.disabled = false;
    save(true);
  }

  /* ---------- Saving ---------- */
  function markSaved() { saved = true; statusEl.textContent = "Video saved."; againBtn.textContent = "Record again"; }

  function anchorSave() {
    var a = document.createElement("a");
    a.href = blobUrl; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    saved = true;
    statusEl.textContent = "Download started. If nothing appeared, tap Save video.";
  }

  function save(auto) {
    if (!blob || !blob.size) return;
    if (downloads) {
      statusEl.textContent = "Confirm the save prompt to keep your video.";
      downloads.save({ filename: filename, data: blob }).then(markSaved).catch(function (e) {
        var code = e && e.code;
        if (code === "declined") statusEl.textContent = "Not saved yet. Tap Save video when you’re ready.";
        else if (code === "rate_limited") statusEl.textContent = "A save prompt is already open, or try again in a moment.";
        else if (auto) statusEl.textContent = "Tap Save video to keep the recording.";
        else fallbackSave();
      });
      return;
    }
    if (auto) {
      if (isTop) { try { anchorSave(); } catch (e) { statusEl.textContent = "Tap Save video to keep the recording."; } }
      else statusEl.textContent = "Tap Save video to keep the recording.";
      return;
    }
    fallbackSave();
  }

  function fallbackSave() {
    var file = null;
    try { file = new File([blob], filename, { type: blob.type }); } catch (e) {}
    if (file && navigator.canShare && navigator.canShare({ files: [file] })) {
      navigator.share({ files: [file] }).then(markSaved).catch(function (e) {
        if (e && e.name === "AbortError") statusEl.textContent = "Not saved yet. Tap Save video when you’re ready.";
        else tryAnchor();
      });
      return;
    }
    tryAnchor();
  }
  function tryAnchor() {
    try { anchorSave(); }
    catch (e) { statusEl.textContent = "Saving isn’t available in this view. Use the playback above and its share button instead."; }
  }

  saveBtn.addEventListener("click", function () { save(false); });

  againBtn.addEventListener("click", function () {
    if (!saved && blob && blob.size && againBtn.textContent === "Record again") {
      againBtn.textContent = "Discard and record again";
      statusEl.textContent = "This video isn’t saved yet.";
      return;
    }
    discard();
    openStage();
  });
  $("edit").addEventListener("click", function () {
    try { playback.pause(); } catch (e) {}
    show(setup);
  });
  function discard() {
    try { playback.pause(); } catch (e) {}
    playback.removeAttribute("src"); playback.load();
    if (blobUrl) { URL.revokeObjectURL(blobUrl); blobUrl = null; }
    blob = null;
  }

  /* ---------- Stage controls ---------- */
  $("close").addEventListener("click", function () {
    if (state === "recording") { stopRecording(); return; }
    cancelCountdown();
    stopCamera(); releaseWake();
    show(setup);
  });
  $("sizeDown").addEventListener("click", function () { fontSize = clamp(fontSize - 3, 20, 68); applySize(); store.set("tp.size", String(fontSize)); pos = scroller.scrollTop; });
  $("sizeUp").addEventListener("click", function () { fontSize = clamp(fontSize + 3, 20, 68); applySize(); store.set("tp.size", String(fontSize)); pos = scroller.scrollTop; });
  $("speedDown").addEventListener("click", function () { speed = clamp(speed - 1, 0, 10); applySpeed(); store.set("tp.speed", String(speed)); });
  $("speedUp").addEventListener("click", function () { speed = clamp(speed + 1, 0, 10); applySpeed(); store.set("tp.speed", String(speed)); });

  // Tap the text to pause or resume scrolling; drag to move it by hand
  scroller.addEventListener("click", function () {
    if (state !== "recording") return;
    paused = !paused;
    pos = scroller.scrollTop;
    chip.hidden = !paused;
  });
  scroller.addEventListener("touchstart", function () { touching = true; if (touchTimer) clearTimeout(touchTimer); }, { passive: true });
  function touchDone() {
    if (touchTimer) clearTimeout(touchTimer);
    touchTimer = setTimeout(function () { pos = scroller.scrollTop; touching = false; }, 700);
  }
  scroller.addEventListener("touchend", touchDone, { passive: true });
  scroller.addEventListener("touchcancel", touchDone, { passive: true });

  function frame(t) {
    var dt = Math.min((t - lastT) / 1000, 0.1); lastT = t;
    if (state === "recording" && !paused && !touching && speed > 0) {
      var max = scroller.scrollHeight - scroller.clientHeight;
      pos = Math.min(max, pos + speed * fontSize * 0.18 * dt);
      scroller.scrollTop = pos;
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(function (t) { lastT = t; requestAnimationFrame(frame); });

  // iOS cuts the camera when the page goes to the background: keep what was recorded
  document.addEventListener("visibilitychange", function () {
    if (document.hidden) {
      if (state === "recording") stopRecording();
      else if (state === "countdown") cancelCountdown();
    } else if (!stage.hidden) {
      requestWake();
    }
  });
})();
</script>
</body>
</html>
